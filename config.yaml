port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info  #silent  # 减少日志记录
external-controller: 127.0.0.1:9090
ipv6: false  # 【关键】关闭 IPv6 防止通过运营商地址泄露真实位置

# ==========================================
# DNS 设置（防泄露/防检测核心）
# ==========================================
#dns:
#  enable: true
#  listen: 0.0.0.0:53
#  enhanced-mode: fake-ip
#  nameserver:
#    - 8.8.8.8
#    - 1.1.1.1
#  fallback:
#    - https://dns.google/dns-query
#    - https://cloudflare-dns.com/dns-query
# DNS - 全 DoH 隐私模式
dns:
  enable: true
  ipv6: false  # ← DNS 不查询 IPv6
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    - https://dns.quad9.net/dns-query


proxies:
  - name: "洛杉矶"
    type: ss
