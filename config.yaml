# 1. 基础设置
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
ipv6: false  # 【关键】关闭 IPv6 防止真实 IP 泄露

# 2. DNS 设置（防止 Gemini 检测到你在国内）
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query
    - 8.8.8.8

# 3. 代理分组（解决你图片中的报错）
proxy-groups:
  - name: Proxy  # 【重要】确保 rules 里的名称与这里一致
    type: select
    proxies:
      - 自动选择
      - 美国节点  # 确保你的订阅里有这些节点
      - 新加坡节点

# 4. 路由规则（针对 Gemini 深度优化）
rules:
  # Gemini 专项规则（放在最顶部）
  - DOMAIN,gemini.google.com,Proxy
  - DOMAIN-SUFFIX,generativelanguage.googleapis.com,Proxy
  - DOMAIN-SUFFIX,ai.google.com,Proxy
  - DOMAIN-KEYWORD,googleai,Proxy
  
  # 常规 Google 分流
  - DOMAIN-SUFFIX,google.com,Proxy
  - DOMAIN-SUFFIX,gstatic.com,Proxy
  
  # 防止国内流量走代理
  - GEOIP,CN,DIRECT
  - MATCH,Proxy

