# ==========================================
# 基础设置
# ==========================================
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
ipv6: false  # 【关键】关闭 IPv6 防止通过运营商地址泄露真实位置

# ==========================================
# DNS 设置（防泄露/防检测核心）
# ==========================================
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query
    - 8.8.8.8

# ==========================================
# 节点信息
# ==========================================
proxies:
  - name: "洛杉矶_双ISP"
    type: ss
    server: 67.102.180.143
    port: 55168
    cipher: aes-256-gcm
    password: "57V/WcMMJ/aF3rnby0QungsxjlQkglICjSReqsJTjbA="  # 确保密码用引号包裹
    udp: true

# ==========================================
# 代理分组（修复之前报错的关键）
# ==========================================
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - "洛杉矶_双ISP"
      - DIRECT

# ==========================================
# 分流规则（解决 Gemini 访问权限限制）
# ==========================================
rules:
  # --- Gemini 专项优化规则 ---
  - DOMAIN,gemini.google.com,🚀 节点选择
  - DOMAIN-SUFFIX,generativelanguage.googleapis.com,🚀 节点选择
  - DOMAIN-SUFFIX,ai.google.com,🚀 节点选择
  - DOMAIN-KEYWORD,googleai,🚀 节点选择
  
  # --- Google 基础分流 ---
  - DOMAIN-SUFFIX,google.com,🚀 节点选择
  - DOMAIN-SUFFIX,gstatic.com,🚀 节点选择
  
  # --- 国内流量直连 ---
  - GEOIP,CN,DIRECT
  - MATCH,🚀 节点选择
