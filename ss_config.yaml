# ============================================
# Clash Verge 配置 - Google 学生优惠专用
# 修复版本 - 2026-01-13
# ============================================

# 基础设置
mixed-port: 7890
allow-lan: false
mode: rule                    # ← 改为规则模式
log-level: info
ipv6: false                   # ← 禁用 IPv6
unified-delay: true
external-controller: 127.0.0.1:9090

# TUN 模式（可选，建议关闭）
tun:
  enable: false               # ← 关闭 TUN 模式，避免冲突
  auto-route: false
  auto-detect-interface: false

# DNS 配置（关键修复）
dns:
  enable: false               # ← 完全禁用 Clash DNS，使用系统 DNS
  # 如果要启用，使用下面的配置：
  # enable: true
  # listen: 127.0.0.1:53
  # ipv6: false
  # enhanced-mode: redir-host
  # nameserver:
  #   - https://dns.google/dns-query
  #   - https://cloudflare-dns.com/dns-query
  #   - 8.8.8.8
  #   - 1.1.1.1

# 代理配置
proxies:
  # Proxy-Cheap Comcast 住宅代理
  - name: "美国住宅IP"
    type: http
    server: "46.34.39.123"
    port: 43321
    username: "WA8eNELH64mNmhp"
    password: "bWPDb9vGglhV4t1"
    tls: false

  # Shadowsocks 洛杉矶
  - name: "洛杉矶"
    type: ss
    server: "67.102.180.143"
    port: 55168
    cipher: aes-256-gcm
    password: "57V/WcMMJ/aF3rnby0QungsxjlQkglICjSReqsJTjbA="
    udp: true

# 代理组
proxy-groups:
  # 主选择组
  - name: "代理选择"
    type: select
    proxies:
      - "美国住宅IP"
      - "洛杉矶"
      - DIRECT

  # Google 验证专用（强制 Comcast）
  - name: "Google验证"
    type: select
    proxies:
      - "美国住宅IP"

  # AI 服务
  - name: "AI服务"
    type: select
    proxies:
      - "代理选择"
      - "美国住宅IP"
      - "洛杉矶"

  # 自动回退（稳定性优先）
  - name: "自动回退"
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "美国住宅IP"
      - "洛杉矶"

# 规则配置
rules:
  # ========================================
  # 局域网直连（必须在最前面）
  # ========================================
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

  # ========================================
  # Google 学生验证（必须走 Comcast）
  # ========================================
