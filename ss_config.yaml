# Clash Verge 配置文件
port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

proxies:
  - name: "ProxyCheap-US"
    type: http
    server: 46.34.39.123
    port: 43321
    username: WA8eNELH64mNmhp
    password: "你的密码"  # 请替换为实际密码
    # 如果支持 HTTPS，可以改为:
    # type: https
    # tls: true

proxy-groups:
  - name: "代理选择"
    type: select
    proxies:
      - ProxyCheap-US
      - DIRECT

  - name: "自动选择"
    type: url-test
    proxies:
      - ProxyCheap-US
    url: 'http://www.gstatic.com/generate_204'
    interval: 300

rules:
  # 常用规则
  - DOMAIN-SUFFIX,google.com,代理选择
  - DOMAIN-SUFFIX,youtube.com,代理选择
  - DOMAIN-SUFFIX,facebook.com,代理选择
  - DOMAIN-SUFFIX,twitter.com,代理选择
  - DOMAIN-KEYWORD,google,代理选择
  
  # 国内直连
  - DOMAIN-SUFFIX,cn,DIRECT
  - DOMAIN-KEYWORD,baidu,DIRECT
  - GEOIP,CN,DIRECT
  
  # 默认规则
  - MATCH,代理选择
